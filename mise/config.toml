# Bootstrap https://mise.jdx.dev/bootstrap.html
[bootstrap.packages]
"brew:awscli" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:git" = "latest"
"brew:jq" = "latest"
"brew:mas" = "latest"
"brew:mise" = "latest"
"brew:mole" = "latest"
"brew:starship" = "latest"
"brew:zsh-completions" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:brave-browser" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:cursor" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:devin-desktop" = "latest"
"brew-cask:font-blex-mono-nerd-font" = "latest"
"brew-cask:font-ibm-plex-mono" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:linear" = "latest"
"brew-cask:opencode-desktop" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:rectangle" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:tablepro" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:yaak" = "latest"
"brew-cask:zed" = "latest"
"mas:1480933944" = "latest" # Vimari

[bootstrap.repos]
"~/.dotfiles" = { url = "git@github.com:matsuokashuhei/dotfiles.git", ref = "main" }

[dotfiles]
"~/.config/mise" = "~/.dotfiles/mise"
"~/.zprofile" = "~/.dotfiles/zprofile"
"~/.zshrc" = "~/.dotfiles/zshrc"
"~/.config/devin/config.json" = "~/.dotfiles/devin/config.json"
"~/.config/ghostty" = "~/.dotfiles/ghostty"
"~/.config/git" = "~/.dotfiles/git"
"~/.config/starship.toml" = "~/.dotfiles/starship.toml"
"~/.config/zed/settings.json" = "~/.dotfiles/zed/settings.json"
"~/Library/Application Support/Cursor/User/keybindings.json" = "~/.dotfiles/cursor/keybindings.json"
# "~/Library/Application Support/Rectangle/RectangleConfig.json" = "~/.dotfiles/RectangleConfig.json"

[bootstrap.macos.defaults]
"com.apple.dock" = { autohide = true }
"com.apple.inputmethod.Kotoeri" = { JIMPrefLiveConversionKey = false }
"com.microsoft.VSCode" = { ApplePressAndHoldEnabled = false }
"NSGlobalDomain" = { AppleKeyboardUIMode = 3 }

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.macos.trackpad]
tap_to_click = true

# Environment variables https://mise.jdx.dev/environments/
[env]
_.path = ["~/.codeium/windsurf/bin", "~/.docker/bin", "~/.local/bin"]

# Shell aliases https://mise.jdx.dev/shell-aliases.html
[shell_alias]
ls = "ls -GF"
ll = "ls -l"
la = "ll -a"
pod = "docker run --rm -it -v $PWD:/app cocoapods pod"

[tasks.gh-stack]
run = [
  "gh extension install github/gh-stack",
  "gh skill install github/gh-stack",
]